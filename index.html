<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Media Player</title>
  <!-- Load Puter.js SDK -->
  <script src="https://js.puter.com/v2"></script>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #ff4757;
      --text: #ffffff;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .player-box {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .controls {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .upload-btn {
      background: var(--accent);
      color: #fff;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .status {
      font-size: 0.9em;
      color: #aaa;
    }
    .playlist {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
    }
    .playlist-item {
      padding: 10px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .playlist-item:hover {
      background: #2a2a2a;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Cloud Media Player</h2>

    <!-- Video Display -->
    <div class="player-box">
      <video id="mainPlayer" controls autoplay></video>
    </div>

    <!-- Controls / Upload Form -->
    <div class="controls">
      <label class="upload-btn">
        <span>+ Upload File to Cloud</span>
        <input type="file" id="fileInput" accept="video/*,image/*" style="display:none;">
      </label>
      <div id="status" class="status">Ready</div>
    </div>

    <!-- Shared Cloud Playlist -->
    <div class="playlist">
      <h3>Cloud Media Library</h3>
      <div id="playlistItems">Loading files...</div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const mainPlayer = document.getElementById('mainPlayer');
    const playlistItems = document.getElementById('playlistItems');

    // Load media files on start
    window.addEventListener('DOMContentLoaded', loadPlaylist);

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      status.innerText = "Uploading to cloud...";

      try {
        // Upload file to Puter cloud filesystem
        const uploadedFile = await puter.fs.upload(file);
        
        // Get public URL for playback across devices
        const publicUrl = await puter.fs.getReadURL(uploadedFile.path);

        // Update shared key-value store for cross-device sync
        let currentPlaylist = await puter.kv.get('app_playlist') || [];
        currentPlaylist.push({ name: file.name, url: publicUrl, path: uploadedFile.path });
        await puter.kv.set('app_playlist', currentPlaylist);

        status.innerText = "Upload complete!";
        loadPlaylist();
      } catch (err) {
        status.innerText = "Upload failed: " + err.message;
      }
    });

    async function loadPlaylist() {
      try {
        let items = await puter.kv.get('app_playlist') || [];
        playlistItems.innerHTML = '';

        if (items.length === 0) {
          playlistItems.innerHTML = '<p style="color:#666">No media uploaded yet.</p>';
          return;
        }

        items.forEach((item, index) => {
          const div = document.createElement('div');
          div.className = 'playlist-item';
          div.innerHTML = `<span>${item.name}</span><button style="background:none;border:1px solid #ff4757;color:#ff4757;border-radius:4px;padding:4px 8px;">Play</button>`;
          div.onclick = () => playMedia(item.url);
          playlistItems.appendChild(div);
        });
      } catch (err) {
        playlistItems.innerHTML = 'Error loading library: ' + err.message;
      }
    }

    function playMedia(url) {
      mainPlayer.src = url;
      mainPlayer.play();
    }
  </script>
</body>
</html>
