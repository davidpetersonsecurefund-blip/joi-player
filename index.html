<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensory Matrix Wall</title>
  <script src="https://js.puter.com/v2"></script>
  <style>
    :root {
      --bg: #000000;
      --accent: #9d4edd;
      --hue-speed: 8s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
    }

    /* Start / Audio Unlock Overlay */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      padding: 20px;
    }

    #splash-screen h1 {
      font-size: 3rem;
      letter-spacing: 4px;
      margin-bottom: 15px;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(157, 78, 221, 0.8);
      animation: pulse 2s infinite alternate;
    }

    /* Multi-Video Grid Matrix */
    #video-wall {
      display: grid;
      width: 100vw;
      height: 100vh;
      gap: 2px;
      background: #000;
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Dynamic Grid Layouts */
    .grid-6 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
    .grid-9 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
    .grid-12 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); }

    .tile {
      position: relative;
      background: #050505;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* Hypnotic FX Layer */
    #hypno-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      mix-blend-mode: overlay;
      opacity: 0.6;
      display: none;
    }

    .fx-active #hypno-overlay {
      display: block;
      background: linear-gradient(45deg, #ff007f, #00f0ff, #7000ff, #ff0000);
      background-size: 400% 400%;
      animation: hueCycle var(--hue-speed) linear infinite, gradientMove 10s ease infinite;
    }

    @keyframes hueCycle {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes pulse {
      0% { opacity: 0.7; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    /* Auto-Hiding Control Overlay */
    #control-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      z-index: 100;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #control-bar:hover, body.show-controls #control-bar {
      opacity: 1;
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      transition: 0.2s;
      white-space: nowrap;
    }

    .btn:hover, .btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .url-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 260px;
    }

    .url-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .group { display: flex; align-items: center; gap: 10px; }
    label { font-size: 0.8rem; color: #aaa; }
  </style>
</head>
<body>

  <div id="splash-screen" onclick="enterMatrix()">
    <h1>CLICK ANYWHERE TO ENTER</h1>
    <p style="color: #aaa;">Enables instant continuous playback & audio across all videos</p>
  </div>

  <div id="hypno-overlay"></div>
  <div id="video-wall" class="grid-9"></div>

  <div id="control-bar">
    <div class="group">
      <label>Grid:</label>
      <button class="btn" onclick="setGrid(6)">6</button>
      <button class="btn active" onclick="setGrid(9)">9</button>
      <button class="btn" onclick="setGrid(12)">12</button>
    </div>

    <div class="group">
      <button class="btn" id="fx-toggle" onclick="toggleFX()">Toggle Color Shifts</button>
      <button class="btn" id="audio-toggle" onclick="toggleHoverAudio()">Hover To Unmute</button>
    </div>

    <!-- Direct URL Link Sync (No Cloud Storage Limits) -->
    <div class="group">
      <input type="text" id="urlInput" class="url-input" placeholder="Paste direct .mp4 URL (e.g. Catbox link)...">
      <button class="btn" style="background: var(--accent);" onclick="addDirectUrl()">+ Add URL</button>
      <button class="btn" style="border-color: #ff3355; color: #ff3355;" onclick="clearLibrary()">Clear Links</button>
    </div>
  </div>

  <script>
    let mediaList = [
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoypasses.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4"
    ];

    let gridCount = 9;
    let hoverAudioEnabled = true;
    let audioContextUnlocked = false;

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        let saved = await puter.kv.get('wall_urls') || [];
        if (saved.length > 0) mediaList = saved;
      } catch(e) {}
    });

    function enterMatrix() {
      document.getElementById('splash-screen').style.display = 'none';
      audioContextUnlocked = true;
      buildGrid();
    }

    function setGrid(count) {
      gridCount = count;
      document.getElementById('video-wall').className = `grid-${count}`;
      buildGrid();
    }

    function buildGrid() {
      const wall = document.getElementById('video-wall');
      wall.innerHTML = '';

      for (let i = 0; i < gridCount; i++) {
        const tile = document.createElement('div');
        tile.className = 'tile';

        const video = document.createElement('video');
        video.src = mediaList[i % mediaList.length];
        video.autoplay = true;
        video.loop = true;
        video.playsInline = true;
        video.muted = true;

        tile.addEventListener('mouseenter', () => {
          if (hoverAudioEnabled && audioContextUnlocked) {
            video.muted = false;
            video.play();
          }
        });

        tile.addEventListener('mouseleave', () => {
          if (hoverAudioEnabled) {
            video.muted = true;
          }
        });

        tile.appendChild(video);
        wall.appendChild(tile);
        video.play().catch(() => {});
      }
    }

    function toggleFX() {
      document.body.classList.toggle('fx-active');
      document.getElementById('fx-toggle').classList.toggle('active');
    }

    function toggleHoverAudio() {
      hoverAudioEnabled = !hoverAudioEnabled;
      const btn = document.getElementById('audio-toggle');
      btn.innerText = hoverAudioEnabled ? "Hover To Unmute" : "All Muted";
      btn.classList.toggle('active');
    }

    async function addDirectUrl() {
      const input = document.getElementById('urlInput');
      const url = input.value.trim();
      if (!url) return;

      mediaList.unshift(url);
      input.value = '';

      try {
        await puter.kv.set('wall_urls', mediaList);
      } catch(e) {}

      buildGrid();
    }

    async function clearLibrary() {
      if (!confirm("Reset playlist links?")) return;
      mediaList = [];
      try {
        await puter.kv.del('wall_urls');
      } catch(e) {}
      buildGrid();
    }

    let hideTimer;
    window.addEventListener('mousemove', () => {
      document.body.classList.add('show-controls');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        document.body.classList.remove('show-controls');
      }, 2500);
    });
  </script>
</body>
</html>
