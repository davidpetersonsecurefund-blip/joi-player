<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensory Matrix Wall</title>
  <script src="https://js.puter.com/v2"></script>
  <style>
    :root {
      --bg: #000000;
      --accent: #9d4edd;
      --accent-glow: rgba(157, 78, 221, 0.8);
      --hue-speed: 8s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100dvh;
      background: var(--bg);
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      user-select: none;
    }

    /* Start / Audio Unlock Overlay */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      padding: 20px;
    }

    #splash-screen h1 {
      font-size: 2.8rem;
      letter-spacing: 4px;
      margin-bottom: 15px;
      color: var(--accent);
      text-shadow: 0 0 25px var(--accent-glow);
      animation: pulse 2s infinite alternate;
    }

    /* Multi-Video Grid Matrix Container */
    #matrix-container {
      width: 100vw;
      height: 100dvh;
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #video-wall {
      display: grid;
      width: 100%;
      height: 100%;
      gap: 2px;
      background: #000;
    }

    /* Dynamic Grid Layout Definitions */
    .grid-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .grid-4 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
    .grid-6 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
    .grid-9 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
    .grid-12 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); }
    .grid-16 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }
    .grid-25 { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); }
    
    /* Spotlight Layout (1 Main + 8 Minis) */
    .grid-spotlight {
      display: grid !important;
      grid-template-columns: 2fr repeat(2, 1fr) !important;
      grid-template-rows: repeat(4, 1fr) !important;
    }
    .grid-spotlight .tile:first-child {
      grid-column: 1 / span 2;
      grid-row: 1 / span 4;
    }

    /* Mobile Portrait Layout Adjustments */
    @media (orientation: portrait) {
      .grid-6 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); }
      .grid-12 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); }
      .grid-spotlight {
        grid-template-columns: repeat(2, 1fr) !important;
        grid-template-rows: 2fr repeat(4, 1fr) !important;
      }
      .grid-spotlight .tile:first-child {
        grid-column: 1 / span 2;
        grid-row: 1 / span 2;
      }
    }

    .tile {
      position: relative;
      background: #050505;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease, filter 0.3s ease, border-color 0.3s ease;
      border: 1px solid transparent;
    }

    .tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .tile.dimmed {
      filter: brightness(0.2) grayscale(0.8);
    }

    .tile.active-roulette {
      filter: brightness(1.2) contrast(1.1);
      border: 2px solid var(--accent);
      box-shadow: inset 0 0 15px var(--accent-glow);
      z-index: 5;
    }

    /* FX Overlay Layer System */
    #fx-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .fx-scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
    }

    .fx-vignette {
      box-shadow: inset 0 0 100px rgba(0,0,0,0.95);
    }

    .fx-colorshift {
      mix-blend-mode: overlay;
      background: linear-gradient(45deg, #ff007f, #00f0ff, #7000ff, #ff0000);
      background-size: 400% 400%;
      animation: hueCycle var(--hue-speed) linear infinite, gradientMove 10s ease infinite;
      opacity: 0.5;
    }

    .fx-flicker {
      animation: crtFlicker 0.15s infinite;
    }

    .fx-strobe {
      animation: strobeFlash 0.8s infinite alternate;
    }

    @keyframes hueCycle {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes crtFlicker {
      0% { opacity: 0.97; }
      50% { opacity: 1; }
      100% { opacity: 0.94; }
    }

    @keyframes strobeFlash {
      0% { background: rgba(157, 78, 221, 0); }
      100% { background: rgba(157, 78, 221, 0.15); }
    }

    @keyframes pulse {
      0% { opacity: 0.7; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    /* Scrollable Auto-Hiding Control Bar */
    #control-bar-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(5, 5, 5, 0.92);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: translateY(100%);
    }

    #control-bar-wrapper:hover, body.show-controls #control-bar-wrapper {
      opacity: 1;
      transform: translateY(0);
    }

    #control-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 10px 15px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) transparent;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .group-label {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      color: #888;
      margin-right: 2px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      color: #eee;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }

    .btn:hover, .btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .url-input {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      width: 200px;
      height: 30px;
      resize: none;
    }

    .url-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .slider {
      width: 80px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Custom File Input Styling */
    .file-btn-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .file-btn-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Entry Unlock Overlay -->
  <div id="splash-screen" onclick="enterMatrix()">
    <h1>CLICK ANYWHERE TO ENTER</h1>
    <p style="color: #aaa;">Unlocks multi-video synchronized playback & ambient audio stream</p>
  </div>

  <!-- Atmospheric Visual FX Stack -->
  <div id="fx-container"></div>

  <!-- Video Wall Grid Container -->
  <div id="matrix-container">
    <div id="video-wall" class="grid-9"></div>
  </div>

  <!-- Background Audio Track Overlay -->
  <audio id="audio-overlay" loop></audio>

  <!-- Auto-Hiding Control Bar -->
  <div id="control-bar-wrapper">
    <div id="control-bar">
      
      <!-- Grid Layout Selector -->
      <div class="group">
        <span class="group-label">Grid</span>
        <button class="btn" onclick="setGrid(1)">1x1</button>
        <button class="btn" onclick="setGrid(4)">2x2</button>
        <button class="btn" onclick="setGrid(6)">3x2</button>
        <button class="btn active" id="btn-g9" onclick="setGrid(9)">3x3</button>
        <button class="btn" onclick="setGrid(12)">4x3</button>
        <button class="btn" onclick="setGrid(16)">4x4</button>
        <button class="btn" onclick="setGrid(25)">5x5</button>
        <button class="btn" onclick="setGrid('spotlight')">1+8</button>
      </div>

      <!-- Audio Mode Controls -->
      <div class="group">
        <span class="group-label">Audio</span>
        <button class="btn active" id="btn-audio-hover" onclick="setAudioMode('hover')">Hover Unmute</button>
        <button class="btn" id="btn-audio-all" onclick="setAudioMode('all')">Unmute All</button>
        <button class="btn" id="btn-audio-mute" onclick="setAudioMode('mute')">Mute All</button>
      </div>

      <!-- Audio Overlay (JOI / Music Track) -->
      <div class="group">
        <span class="group-label">Audio Overlay</span>
        <div class="file-btn-wrapper">
          <button class="btn">+ Upload MP3</button>
          <input type="file" accept="audio/*" onchange="handleAudioUpload(event)">
        </div>
        <input type="text" id="audioUrlInput" class="url-input" style="width: 130px;" placeholder="Audio URL..." onchange="handleAudioUrl(this.value)">
        <input type="range" id="audioVolume" class="slider" min="0" max="1" step="0.05" value="0.7" oninput="setOverlayVolume(this.value)">
      </div>

      <!-- Visual FX Toggles -->
      <div class="group">
        <span class="group-label">Vibe FX</span>
        <button class="btn" onclick="toggleFX('fx-scanlines', this)">Scanlines</button>
        <button class="btn" onclick="toggleFX('fx-flicker', this)">CRT Flicker</button>
        <button class="btn" onclick="toggleFX('fx-vignette', this)">Vignette</button>
        <button class="btn" onclick="toggleFX('fx-colorshift', this)">Color Shift</button>
        <button class="btn" onclick="toggleFX('fx-strobe', this)">Strobe</button>
      </div>

      <!-- Modes & Automation -->
      <div class="group">
        <span class="group-label">Modes</span>
        <button class="btn" id="btn-rotate" onclick="toggleAutoRotate()">Auto-Rotate (10-15s)</button>
        <button class="btn" id="btn-roulette" onclick="toggleRoulette()">Roulette</button>
        <button class="btn" id="btn-chaos" onclick="toggleSpeedChaos()">Speed Chaos</button>
      </div>

      <!-- Batch Link Management -->
      <div class="group">
        <textarea id="urlInput" class="url-input" placeholder="Paste links or Catbox page text..."></textarea>
        <button class="btn" style="background: var(--accent);" onclick="addDirectUrls()">+ Add Links</button>
        <button class="btn" style="border-color: #ff3355; color: #ff3355;" onclick="clearLibrary()">Clear</button>
      </div>

    </div>
  </div>

  <script>
    // Default fallback video list
    let mediaList = [
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoypasses.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4"
    ];

    let currentGrid = 9;
    let audioMode = 'hover'; // 'hover' | 'all' | 'mute'
    let audioUnlocked = false;

    // Timers & State Flags
    let autoRotateTimer = null;
    let rouletteInterval = null;
    let speedChaosActive = false;

    // Load saved URLs from Puter Key-Value Storage
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        let saved = await puter.kv.get('wall_urls') || [];
        if (saved.length > 0) mediaList = saved;
      } catch(e) {}
    });

    function enterMatrix() {
      document.getElementById('splash-screen').style.display = 'none';
      audioUnlocked = true;
      
      buildGrid();
      
      // Automatically engage auto-rotate mode if it isn't active yet
      if (!document.getElementById('btn-rotate').classList.contains('active')) {
        toggleAutoRotate(true);
      }
      
      const overlayAudio = document.getElementById('audio-overlay');
      if (overlayAudio.src) overlayAudio.play().catch(() => {});
    }

    function setGrid(count) {
      currentGrid = count;
      const wall = document.getElementById('video-wall');
      
      wall.className = '';
      if (count === 'spotlight') {
        wall.classList.add('grid-spotlight');
      } else {
        wall.classList.add(`grid-${count}`);
      }

      document.querySelectorAll('.group:first-child .btn').forEach(b => b.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');

      buildGrid();
    }

    // Assigns a random video source with automatic error fallback
    function assignRandomVideoSource(videoElement, retries = 0) {
      if (mediaList.length === 0 || retries > 10) return;

      const randomIndex = Math.floor(Math.random() * mediaList.length);
      const chosenUrl = mediaList[randomIndex];

      videoElement.src = chosenUrl;
      
      // If the link fails to load/play, pick a different URL automatically
      videoElement.onerror = () => {
        assignRandomVideoSource(videoElement, retries + 1);
      };

      videoElement.play().catch(() => {});
    }

    function buildGrid() {
      const wall = document.getElementById('video-wall');
      wall.innerHTML = '';

      if (mediaList.length === 0) return;

      const tileCount = currentGrid === 'spotlight' ? 9 : parseInt(currentGrid);

      for (let i = 0; i < tileCount; i++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.index = i;

        const video = document.createElement('video');
        video.autoplay = true;
        video.loop = true;
        video.playsInline = true;
        video.muted = audioMode !== 'all';

        if (speedChaosActive) {
          video.playbackRate = (Math.random() * (1.75 - 0.75) + 0.75).toFixed(2);
        }

        assignRandomVideoSource(video);

        // Hover interactions
        tile.addEventListener('mouseenter', () => {
          if (audioMode === 'hover' && audioUnlocked && !rouletteInterval) {
            video.muted = false;
            video.play();
          }
        });

        tile.addEventListener('mouseleave', () => {
          if (audioMode === 'hover' && !rouletteInterval) {
            video.muted = true;
          }
        });

        tile.appendChild(video);
        wall.appendChild(tile);
      }
    }

    /* Audio Mode Handler */
    function setAudioMode(mode) {
      audioMode = mode;
      
      document.getElementById('btn-audio-hover').classList.toggle('active', mode === 'hover');
      document.getElementById('btn-audio-all').classList.toggle('active', mode === 'all');
      document.getElementById('btn-audio-mute').classList.toggle('active', mode === 'mute');

      const videos = document.querySelectorAll('#video-wall video');
      videos.forEach(v => {
        if (mode === 'all') {
          v.muted = false;
          v.play().catch(() => {});
        } else {
          v.muted = true;
        }
      });
    }

    /* Background Audio Overlay Options */
    function handleAudioUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        playAudioOverlay(url);
      }
    }

    function handleAudioUrl(url) {
      if (url.trim()) playAudioOverlay(url.trim());
    }

    function playAudioOverlay(src) {
      const audio = document.getElementById('audio-overlay');
      audio.src = src;
      if (audioUnlocked) audio.play().catch(() => {});
    }

    function setOverlayVolume(val) {
      document.getElementById('audio-overlay').volume = parseFloat(val);
    }

    /* Visual FX Toggles */
    function toggleFX(fxClass, btn) {
      const container = document.getElementById('fx-container');
      container.classList.toggle(fxClass);
      btn.classList.toggle('active');
    }

    /* Mode: Auto-Rotate / Video Swap (10-15s Random Interval) */
    function toggleAutoRotate(forceState = null) {
      const btn = document.getElementById('btn-rotate');
      const isEnabling = forceState !== null ? forceState : !btn.classList.contains('active');

      if (!isEnabling) {
        clearTimeout(autoRotateTimer);
        autoRotateTimer = null;
        btn.classList.remove('active');
        btn.innerText = "Auto-Rotate (Off)";
      } else {
        btn.classList.add('active');
        btn.innerText = "Auto-Rotate (10-15s)";
        scheduleNextRotation();
      }
    }

    function scheduleNextRotation() {
      const delay = Math.floor(Math.random() * 5000) + 10000; 
      
      autoRotateTimer = setTimeout(() => {
        rotateGridVideos();
        if (document.getElementById('btn-rotate').classList.contains('active')) {
          scheduleNextRotation();
        }
      }, delay);
    }

    function rotateGridVideos() {
      const videos = document.querySelectorAll('#video-wall video');
      if (mediaList.length === 0 || videos.length === 0) return;

      videos.forEach((video) => {
        assignRandomVideoSource(video);
      });
    }

    /* Mode: Spotlight Roulette */
    function toggleRoulette() {
      const btn = document.getElementById('btn-roulette');
      if (rouletteInterval) {
        clearInterval(rouletteInterval);
        rouletteInterval = null;
        btn.classList.remove('active');
        
        document.querySelectorAll('.tile').forEach(t => t.classList.remove('dimmed', 'active-roulette'));
        setAudioMode(audioMode);
      } else {
        btn.classList.add('active');
        runRouletteStep();
        rouletteInterval = setInterval(runRouletteStep, 4000);
      }
    }

    function runRouletteStep() {
      const tiles = Array.from(document.querySelectorAll('.tile'));
      if (tiles.length === 0) return;

      const activeIndex = Math.floor(Math.random() * tiles.length);

      tiles.forEach((tile, idx) => {
        const video = tile.querySelector('video');
        if (idx === activeIndex) {
          tile.classList.remove('dimmed');
          tile.classList.add('active-roulette');
          if (video) {
            video.muted = false;
            video.play().catch(() => {});
          }
        } else {
          tile.classList.add('dimmed');
          tile.classList.remove('active-roulette');
          if (video) video.muted = true;
        }
      });
    }

    /* Mode: Speed Chaos */
    function toggleSpeedChaos() {
      const btn = document.getElementById('btn-chaos');
      speedChaosActive = !speedChaosActive;
      btn.classList.toggle('active', speedChaosActive);

      const videos = document.querySelectorAll('#video-wall video');
      videos.forEach(video => {
        video.playbackRate = speedChaosActive 
          ? parseFloat((Math.random() * (1.75 - 0.75) + 0.75).toFixed(2))
          : 1.0;
      });
    }

    /* Extract & Store Batch URLs */
    async function addDirectUrls() {
      const input = document.getElementById('urlInput');
      const rawText = input.value.trim();
      if (!rawText) return;

      const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      let extractedUrls = [];

      for (let line of lines) {
        const filebinBinMatch = line.match(/^https:\/\/filebin\.net\/([a-zA-Z0-9]+)$/);

        if (filebinBinMatch) {
          try {
            const response = await fetch(`${line}.txt`);
            const textData = await response.text();
            const fileUrls = textData.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            extractedUrls.push(...fileUrls);
          } catch (error) {
            console.error("Failed to fetch Filebin list:", error);
          }
        } else {
          const urlRegex = /(https?:\/\/[^\s"',]+)/g;
          const matches = line.match(urlRegex) || [];
          
          const validMatches = matches
            .map(url => url.replace(/;$/, '').trim())
            .filter(url => 
              url.includes('files.catbox.moe') || 
              url.includes('filebin.net') || 
              url.match(/\.(mp4|webm|mov)(\?.*)?$/i)
            );
          
          extractedUrls.push(...validMatches);
        }
      }

      if (extractedUrls.length === 0) {
        alert("No valid video, Catbox, or Filebin links found in input.");
        return;
      }

      const uniqueUrls = [...new Set(extractedUrls)];
      mediaList = [...uniqueUrls, ...mediaList];
      input.value = '';

      try {
        await puter.kv.set('wall_urls', mediaList);
      } catch(e) {}

      buildGrid();
    }

    async function clearLibrary() {
      if (!confirm("Reset video link library?")) return;
      mediaList = [];
      try {
        await puter.kv.del('wall_urls');
      } catch(e) {}
      buildGrid();
    }

    /* Controls Bar Auto-Hide Timer */
    let hideTimer;
    window.addEventListener('mousemove', () => {
      document.body.classList.add('show-controls');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        document.body.classList.remove('show-controls');
      }, 3000);
    });
  </script>
</body>
</html>
