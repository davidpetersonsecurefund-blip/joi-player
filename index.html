<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensory Matrix Wall</title>
  <script src="https://js.puter.com/v2"></script>
  <style>
    :root {
      --bg: #000000;
      --accent: #9d4edd;
      --accent-glow: rgba(157, 78, 221, 0.6);
      --hue-speed: 12s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100dvh;
      background: var(--bg);
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      user-select: none;
    }

    /* Start / Audio Unlock Overlay */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      padding: 20px;
    }

    #splash-screen h1 {
      font-size: 2.8rem;
      letter-spacing: 4px;
      margin-bottom: 15px;
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent-glow);
    }

    /* Multi-Video Grid Matrix Container */
    #matrix-container {
      width: 100vw;
      height: 100dvh;
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #video-wall {
      display: grid;
      width: 100%;
      height: 100%;
      gap: 2px;
      background: #000;
    }

    /* Dynamic Grid Layout Definitions */
    .grid-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .grid-4 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
    .grid-6 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
    .grid-9 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
    .grid-12 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); }
    .grid-16 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }
    .grid-25 { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); }
    
    /* Spotlight Layout */
    .grid-spotlight {
      display: grid !important;
      grid-template-columns: 2fr repeat(2, 1fr) !important;
      grid-template-rows: repeat(4, 1fr) !important;
    }
    .grid-spotlight .tile:first-child {
      grid-column: 1 / span 2;
      grid-row: 1 / span 4;
    }

    @media (orientation: portrait) {
      .grid-6 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); }
      .grid-12 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); }
      .grid-spotlight {
        grid-template-columns: repeat(2, 1fr) !important;
        grid-template-rows: 2fr repeat(4, 1fr) !important;
      }
      .grid-spotlight .tile:first-child {
        grid-column: 1 / span 2;
        grid-row: 1 / span 2;
      }
    }

    .tile {
      position: relative;
      background: #050505;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateZ(0);
      will-change: transform;
      border: 1px solid transparent;
    }

    .tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      transform: translateZ(0);
    }

    .tile.dimmed {
      opacity: 0.25;
    }

    .tile.active-roulette {
      opacity: 1;
      border: 2px solid var(--accent);
      z-index: 5;
    }

    /* FX System */
    #fx-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      transform: translateZ(0);
    }

    .fx-scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
    }

    .fx-vignette {
      box-shadow: inset 0 0 80px rgba(0,0,0,0.85);
    }

    .fx-colorshift {
      background: linear-gradient(45deg, rgba(255,0,127,0.2), rgba(0,240,255,0.2), rgba(112,0,255,0.2));
      animation: hueCycle var(--hue-speed) linear infinite;
    }

    .fx-flicker {
      animation: crtFlicker 0.2s infinite;
    }

    .fx-strobe {
      animation: strobeFlash 1s infinite alternate;
    }

    @keyframes hueCycle {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    @keyframes crtFlicker {
      0%, 100% { opacity: 0.98; }
      50% { opacity: 0.93; }
    }

    @keyframes strobeFlash {
      0% { background: rgba(157, 78, 221, 0); }
      100% { background: rgba(157, 78, 221, 0.12); }
    }

    /* Control Bar Overlay */
    #control-bar-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      transform: translateY(100%);
    }

    #control-bar-wrapper:hover, body.show-controls #control-bar-wrapper {
      opacity: 1;
      transform: translateY(0);
    }

    #control-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 10px 15px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .group-label {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      color: #888;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      color: #eee;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .btn:hover, .btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .url-input {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      width: 200px;
      height: 30px;
      resize: none;
    }

    .slider {
      width: 80px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .file-btn-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .file-btn-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Entry Overlay -->
  <div id="splash-screen" onclick="enterMatrix()">
    <h1>CLICK ANYWHERE TO ENTER</h1>
    <p style="color: #aaa;">Unlocks multi-video matrix playback</p>
  </div>

  <!-- FX Container -->
  <div id="fx-container"></div>

  <!-- Matrix Grid Container -->
  <div id="matrix-container">
    <div id="video-wall" class="grid-9"></div>
  </div>

  <audio id="audio-overlay" loop></audio>

  <!-- Auto-Hiding Bar -->
  <div id="control-bar-wrapper">
    <div id="control-bar">
      
      <div class="group">
        <span class="group-label">Grid</span>
        <button class="btn" onclick="setGrid(1)">1x1</button>
        <button class="btn" onclick="setGrid(4)">2x2</button>
        <button class="btn" onclick="setGrid(6)">3x2</button>
        <button class="btn active" id="btn-g9" onclick="setGrid(9)">3x3</button>
        <button class="btn" onclick="setGrid(12)">4x3</button>
        <button class="btn" onclick="setGrid(16)">4x4</button>
        <button class="btn" onclick="setGrid(25)">5x5</button>
        <button class="btn" onclick="setGrid('spotlight')">1+8</button>
      </div>

      <div class="group">
        <span class="group-label">Audio</span>
        <button class="btn active" id="btn-audio-hover" onclick="setAudioMode('hover')">Hover Unmute</button>
        <button class="btn" id="btn-audio-all" onclick="setAudioMode('all')">Unmute All</button>
        <button class="btn" id="btn-audio-mute" onclick="setAudioMode('mute')">Mute All</button>
      </div>

      <div class="group">
        <span class="group-label">Audio Overlay</span>
        <div class="file-btn-wrapper">
          <button class="btn">+ Upload MP3</button>
          <input type="file" accept="audio/*" onchange="handleAudioUpload(event)">
        </div>
        <input type="text" id="audioUrlInput" class="url-input" style="width: 130px;" placeholder="Audio URL..." onchange="handleAudioUrl(this.value)">
        <input type="range" id="audioVolume" class="slider" min="0" max="1" step="0.05" value="0.7" oninput="setOverlayVolume(this.value)">
      </div>

      <div class="group">
        <span class="group-label">Vibe FX</span>
        <button class="btn" onclick="toggleFX('fx-scanlines', this)">Scanlines</button>
        <button class="btn" onclick="toggleFX('fx-flicker', this)">CRT Flicker</button>
        <button class="btn" onclick="toggleFX('fx-vignette', this)">Vignette</button>
        <button class="btn" onclick="toggleFX('fx-colorshift', this)">Color Shift</button>
        <button class="btn" onclick="toggleFX('fx-strobe', this)">Strobe</button>
      </div>

      <div class="group">
        <span class="group-label">Modes</span>
        <button class="btn" id="btn-rotate" onclick="toggleAutoRotate()">Auto-Rotate</button>
        <button class="btn" id="btn-roulette" onclick="toggleRoulette()">Roulette</button>
        <button class="btn" id="btn-chaos" onclick="toggleSpeedChaos()">Speed Chaos</button>
      </div>

      <div class="group">
        <textarea id="urlInput" class="url-input" placeholder="Paste links..."></textarea>
        <button class="btn" style="background: var(--accent);" onclick="addDirectUrls()">+ Add Links</button>
        <button class="btn" style="border-color: #ff3355; color: #ff3355;" onclick="clearLibrary()">Clear</button>
      </div>

    </div>
  </div>

  <script>
    let mediaList = [
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoypasses.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4"
    ];

    let shuffleDeck = [];
    let currentGrid = 9;
    let audioMode = 'hover';
    let audioUnlocked = false;

    let autoRotateTimer = null;
    let rouletteInterval = null;
    let speedChaosActive = false;

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        let saved = await puter.kv.get('wall_urls') || [];
        if (saved.length > 0) mediaList = saved;
      } catch(e) {}
    });

    function enterMatrix() {
      document.getElementById('splash-screen').style.display = 'none';
      audioUnlocked = true;
      buildGrid();
    }

    function setGrid(count) {
      currentGrid = count;
      const wall = document.getElementById('video-wall');
      
      wall.className = '';
      if (count === 'spotlight') {
        wall.classList.add('grid-spotlight');
      } else {
        wall.classList.add(`grid-${count}`);
      }

      document.querySelectorAll('.group:first-child .btn').forEach(b => b.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');

      buildGrid();
    }

    /* Helper: Returns active video sources currently rendered on screen */
    function getActiveOnScreenSources(excludeVideo = null) {
      const activeUrls = [];
      document.querySelectorAll('#video-wall video').forEach(v => {
        if (v !== excludeVideo && v.src) {
          activeUrls.push(v.src);
        }
      });
      return activeUrls;
    }

    /* Helper: Shuffled Non-Repeating Queue Draw */
    function getNextVideoUrl(videoElement) {
      if (mediaList.length === 0) return '';

      const activeUrls = getActiveOnScreenSources(videoElement);

      // Refill deck if depleted
      if (shuffleDeck.length === 0) {
        shuffleDeck = [...mediaList].sort(() => Math.random() - 0.5);
      }

      // Try to find a clip from the deck that isn't currently displayed elsewhere on screen
      let chosenIndex = shuffleDeck.findIndex(url => !activeUrls.includes(url));

      // If all deck items are currently on screen (e.g. 25-grid with only 5 videos), fallback to deck head
      if (chosenIndex === -1) {
        chosenIndex = 0;
      }

      const chosenUrl = shuffleDeck.splice(chosenIndex, 1)[0];
      return chosenUrl;
    }

    function assignUniqueVideoSource(videoElement, retries = 0) {
      if (mediaList.length === 0 || retries > 5) return;

      const newUrl = getNextVideoUrl(videoElement);
      if (!newUrl) return;

      videoElement.src = newUrl;

      // Handle broken/dead links without infinite loops
      videoElement.onerror = () => {
        setTimeout(() => {
          assignUniqueVideoSource(videoElement, retries + 1);
        }, 300);
      };

      videoElement.play().catch(() => {});
    }

    function buildGrid() {
      const wall = document.getElementById('video-wall');
      wall.innerHTML = '';

      if (mediaList.length === 0) return;

      // Reset shuffle deck on full grid rebuild
      shuffleDeck = [...mediaList].sort(() => Math.random() - 0.5);

      const tileCount = currentGrid === 'spotlight' ? 9 : parseInt(currentGrid);

      for (let i = 0; i < tileCount; i++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.index = i;

        const video = document.createElement('video');
        video.autoplay = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = "metadata";
        video.muted = audioMode !== 'all';

        if (speedChaosActive) {
          video.playbackRate = (Math.random() * (1.5 - 0.8) + 0.8).toFixed(2);
        }

        tile.appendChild(video);
        wall.appendChild(tile);

        // Stagger initialization slightly for smooth loading
        setTimeout(() => {
          assignUniqueVideoSource(video);
        }, i * 60);

        tile.addEventListener('mouseenter', () => {
          if (audioMode === 'hover' && audioUnlocked && !rouletteInterval) {
            video.muted = false;
            video.play().catch(() => {});
          }
        });

        tile.addEventListener('mouseleave', () => {
          if (audioMode === 'hover' && !rouletteInterval) {
            video.muted = true;
          }
        });
      }
    }

    function setAudioMode(mode) {
      audioMode = mode;
      document.getElementById('btn-audio-hover').classList.toggle('active', mode === 'hover');
      document.getElementById('btn-audio-all').classList.toggle('active', mode === 'all');
      document.getElementById('btn-audio-mute').classList.toggle('active', mode === 'mute');

      const videos = document.querySelectorAll('#video-wall video');
      videos.forEach(v => {
        v.muted = mode !== 'all';
      });
    }

    function handleAudioUpload(event) {
      const file = event.target.files[0];
      if (file) playAudioOverlay(URL.createObjectURL(file));
    }

    function handleAudioUrl(url) {
      if (url.trim()) playAudioOverlay(url.trim());
    }

    function playAudioOverlay(src) {
      const audio = document.getElementById('audio-overlay');
      audio.src = src;
      if (audioUnlocked) audio.play().catch(() => {});
    }

    function setOverlayVolume(val) {
      document.getElementById('audio-overlay').volume = parseFloat(val);
    }

    function toggleFX(fxClass, btn) {
      document.getElementById('fx-container').classList.toggle(fxClass);
      btn.classList.toggle('active');
    }

    function toggleAutoRotate() {
      const btn = document.getElementById('btn-rotate');
      if (autoRotateTimer) {
        clearTimeout(autoRotateTimer);
        autoRotateTimer = null;
        btn.classList.remove('active');
      } else {
        btn.classList.add('active');
        scheduleNextRotation();
      }
    }

    function scheduleNextRotation() {
      autoRotateTimer = setTimeout(() => {
        rotateGridVideos();
        if (autoRotateTimer) scheduleNextRotation();
      }, Math.floor(Math.random() * 5000) + 10000);
    }

    function rotateGridVideos() {
      const videos = document.querySelectorAll('#video-wall video');
      if (videos.length === 0) return;

      videos.forEach((video, idx) => {
        setTimeout(() => assignUniqueVideoSource(video), idx * 80);
      });
    }

    function toggleRoulette() {
      const btn = document.getElementById('btn-roulette');
      if (rouletteInterval) {
        clearInterval(rouletteInterval);
        rouletteInterval = null;
        btn.classList.remove('active');
        document.querySelectorAll('.tile').forEach(t => t.classList.remove('dimmed', 'active-roulette'));
        setAudioMode(audioMode);
      } else {
        btn.classList.add('active');
        runRouletteStep();
        rouletteInterval = setInterval(runRouletteStep, 4000);
      }
    }

    function runRouletteStep() {
      const tiles = Array.from(document.querySelectorAll('.tile'));
      if (tiles.length === 0) return;
      const activeIndex = Math.floor(Math.random() * tiles.length);

      tiles.forEach((tile, idx) => {
        const video = tile.querySelector('video');
        if (idx === activeIndex) {
          tile.classList.remove('dimmed');
          tile.classList.add('active-roulette');
          if (video) { video.muted = false; video.play().catch(() => {}); }
        } else {
          tile.classList.add('dimmed');
          tile.classList.remove('active-roulette');
          if (video) video.muted = true;
        }
      });
    }

    function toggleSpeedChaos() {
      const btn = document.getElementById('btn-chaos');
      speedChaosActive = !speedChaosActive;
      btn.classList.toggle('active', speedChaosActive);

      document.querySelectorAll('#video-wall video').forEach(video => {
        video.playbackRate = speedChaosActive 
          ? parseFloat((Math.random() * (1.5 - 0.8) + 0.8).toFixed(2))
          : 1.0;
      });
    }

    async function addDirectUrls() {
      const input = document.getElementById('urlInput');
      const rawText = input.value.trim();
      if (!rawText) return;

      const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      let extractedUrls = [];

      for (let line of lines) {
        const urlRegex = /(https?:\/\/[^\s"',]+)/g;
        const matches = line.match(urlRegex) || [];
        extractedUrls.push(...matches);
      }

      if (extractedUrls.length === 0) return;

      mediaList = [...new Set([...extractedUrls, ...mediaList])];
      shuffleDeck = [...mediaList].sort(() => Math.random() - 0.5);
      input.value = '';

      try { await puter.kv.set('wall_urls', mediaList); } catch(e) {}
      buildGrid();
    }

    async function clearLibrary() {
      if (!confirm("Reset video link library?")) return;
      mediaList = [];
      shuffleDeck = [];
      try { await puter.kv.del('wall_urls'); } catch(e) {}
      buildGrid();
    }

    let hideTimer;
    window.addEventListener('mousemove', () => {
      document.body.classList.add('show-controls');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        document.body.classList.remove('show-controls');
      }, 3000);
    });
  </script>
</body>
</html>
